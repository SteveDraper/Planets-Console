[project]
name = "mcp_adapter"
version = "0.1.0"
description = "In-process MCP adapter (Streamable HTTP) over Core services"
requires-python = ">=3.14"
dependencies = [
    "api",
    "mcp>=2.0.0,<3",
]

[tool.uv.sources]
api = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../api"]
